<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Personality Scanner — Main</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen flex flex-col justify-between p-4 selection:bg-cyan-500 selection:text-black">

  <!-- Header Ringkas HP -->
  <header class="py-2 border-b border-slate-800/80 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      <span class="text-[11px] font-bold tracking-widest text-cyan-400 uppercase font-mono">SCANNER HP</span>
    </div>
    <span class="text-[11px] font-mono bg-slate-800 border border-slate-700 px-2.5 py-0.5 rounded text-slate-300">INSTITUT ASIA</span>
  </header>

  <main class="flex-1 flex items-center justify-center my-4">

    <!-- STEP 1: INPUT NAMA -->
    <div id="view-name" class="w-full max-w-sm text-center">
      <div class="w-14 h-14 bg-cyan-950 border border-cyan-500/50 rounded-2xl mx-auto flex items-center justify-center text-cyan-300 mb-4 shadow-lg shadow-cyan-500/20">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <h2 class="text-2xl font-black text-white font-display mb-1">MASUKKAN NAMA</h2>
      <p class="text-xs text-slate-400 mb-6">Hasil scan kamu akan langsung muncul di proyektor!</p>
      
      <input id="player-name" type="text" placeholder="Ketik nama panggilan kamu..." class="w-full px-4 py-3.5 rounded-xl bg-slate-900 border border-slate-700 text-white font-semibold text-center focus:outline-none focus:border-cyan-400 mb-4 shadow-inner" />
      <button onclick="submitName()" class="w-full py-3.5 bg-cyan-400 text-slate-900 font-bold rounded-xl active:scale-95 transition-transform shadow-lg shadow-cyan-400/20 tracking-wider text-sm">
        MULAI SCAN (8 SOAL)
      </button>
    </div>

    <!-- STEP 2: THIS-OR-THAT ROUND -->
    <div id="view-quiz" class="w-full max-w-sm hidden flex flex-col justify-between h-[490px]">
      <div>
        <div class="flex justify-between items-center text-xs font-mono font-bold mb-2">
          <span id="round-counter" class="text-cyan-400">RONDE 1 / 8</span>
          <span class="text-slate-500">PILIH CEPAT</span>
        </div>
        <div class="w-full h-1.5 bg-slate-800 rounded-full overflow-hidden mb-6">
          <div id="round-bar" class="h-full bg-gradient-to-r from-cyan-400 to-blue-500 transition-all duration-300 w-[12.5%]"></div>
        </div>
      </div>

      <!-- Opsi A (Kiri) -->
      <button onclick="chooseOption('left')" class="p-5 rounded-2xl border border-slate-800 bg-slate-900 text-left active:bg-cyan-950 active:border-cyan-400 transition-all flex flex-col justify-between h-[175px] shadow-lg">
        <span class="text-[10px] font-mono font-bold text-cyan-400 uppercase bg-cyan-950/80 border border-cyan-800/60 px-2.5 py-0.5 rounded w-fit">Opsi A</span>
        <p id="opt-left-text" class="text-base font-bold text-white leading-snug"></p>
        <span class="text-xs text-cyan-400/80 font-semibold self-end">Pilih Opsi Ini →</span>
      </button>

      <!-- Opsi B (Kanan) -->
      <button onclick="chooseOption('right')" class="p-5 rounded-2xl border border-slate-800 bg-slate-900 text-left active:bg-blue-950 active:border-blue-400 transition-all flex flex-col justify-between h-[175px] shadow-lg">
        <span class="text-[10px] font-mono font-bold text-blue-400 uppercase bg-blue-950/80 border border-blue-800/60 px-2.5 py-0.5 rounded w-fit">Opsi B</span>
        <p id="opt-right-text" class="text-base font-bold text-white leading-snug"></p>
        <span class="text-xs text-blue-400/80 font-semibold self-end">Pilih Opsi Ini →</span>
      </button>
    </div>

    <!-- STEP 3: RESULT REVEAL DI HP -->
    <div id="view-result" class="w-full max-w-sm hidden text-center">
      <div class="p-6 rounded-3xl border border-slate-800 bg-slate-900/90 shadow-2xl relative overflow-hidden">
        <span class="text-[10px] font-mono uppercase tracking-widest text-cyan-400 bg-cyan-950 border border-cyan-800 px-3 py-1 rounded-full">
          HASIL KEPRIBADIANMU
        </span>
        
        <h3 id="res-archetype" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 to-blue-400 font-display mt-3 mb-1"></h3>
        <p id="res-subtitle" class="text-xs text-slate-400 font-mono uppercase mb-4"></p>

        <div class="bg-slate-950 border border-slate-800/80 p-4 rounded-xl text-left text-xs mb-4">
          <p class="text-slate-300 font-semibold mb-1">Jurusan Institut Asia yang cocok buat kamu:</p>
          <p id="res-majors" class="text-cyan-300 font-bold text-sm"></p>
        </div>

        <p id="save-status" class="text-xs text-slate-400 font-mono mb-4 flex items-center justify-center gap-1.5">
          <span class="inline-block w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span> Mengirim ke layar proyektor...
        </p>

        <a href="https://asia.ac.id" target="_blank" class="block w-full py-3.5 bg-cyan-400 hover:bg-cyan-300 text-slate-900 font-bold rounded-xl text-xs uppercase tracking-wider shadow-lg shadow-cyan-400/20 transition-colors">
          Lihat Program Studi di Asia
        </a>
      </div>
    </div>

  </main>

  <footer class="text-center text-[10px] text-slate-500 font-mono">
    Institut Asia Malang
  </footer>

  <script>
    // URL Google Apps Script Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeBih6XjCoBUlnsHn2sFmTB0ecqbRjRTH40SyCykPaazG0wT7UyeGhwLbNSE7Z_aLo/exec";

    let playerName = "";
    let currentRound = 0;
    let scores = { analitis: 0, kreatif: 0, sosial: 0, teknikal: 0, leadership: 0 };

    const questions = [
      { left: { text: "Grup chat kamu isinya ide bisnis", traits: { analitis: 2, leadership: 1 } }, right: { text: "Grup chat kamu isinya meme", traits: { kreatif: 2, sosial: 1 } } },
      { left: { text: "Kalau ada masalah, kamu bikin plan", traits: { analitis: 2, teknikal: 1 } }, right: { text: "Kalau ada masalah, kamu langsung gerak", traits: { leadership: 2, kreatif: 1 } } },
      { left: { text: "Kamu suka ngatur orang", traits: { leadership: 2, sosial: 1 } }, right: { text: "Kamu suka bikin sesuatu sendirian", traits: { teknikal: 2, kreatif: 1 } } },
      { left: { text: "Story IG kamu isinya data/insight", traits: { analitis: 2, teknikal: 1 } }, right: { text: "Story IG kamu isinya visual/estetik", traits: { kreatif: 2, sosial: 1 } } },
      { left: { text: "Kamu lebih suka nebak jawaban orang", traits: { sosial: 2, leadership: 1 } }, right: { text: "Kamu lebih suka nebak angka", traits: { analitis: 2, teknikal: 1 } } },
      { left: { text: "Kalau kelompokan, kamu ambil keputusan", traits: { leadership: 2, analitis: 1 } }, right: { text: "Kamu jadi problem-solver teknis", traits: { teknikal: 2, analitis: 1 } } },
      { left: { text: "Kamu suka barang rapi & terstruktur", traits: { analitis: 2, teknikal: 1 } }, right: { text: "Kamu suka barang random tapi jalan", traits: { kreatif: 2, sosial: 1 } } },
      { left: { text: "Puas kalau orang lain terbantu", traits: { sosial: 2, leadership: 1 } }, right: { text: "Puas kalau target tercapai", traits: { leadership: 2, analitis: 1 } } }
    ];

    const archetypes = {
      analitis: { name: "THE STRATEGIST", subtitle: "Analitis • Terstruktur", majors: "S1 Manajemen Bisnis & Akuntansi" },
      teknikal: { name: "THE BUILDER", subtitle: "Teknikal • Problem Solver", majors: "S1 Informatika & Rekayasa Komputer" },
      kreatif: { name: "THE STORYTELLER", subtitle: "Kreatif • Visual Thinker", majors: "S1 Desain Komunikasi Visual (DKV)" },
      sosial: { name: "THE CONNECTOR", subtitle: "Sosial • Empatik", majors: "S1 Komunikasi & Marketing Digital" },
      leadership: { name: "THE CATALYST", subtitle: "Leadership • Action-Driven", majors: "S1 Bisnis Digital & Manajemen" }
    };

    function submitName() {
      const input = document.getElementById('player-name').value.trim();
      if (!input) return alert("Silakan masukkan nama kamu terlebih dahulu!");
      playerName = input;
      document.getElementById('view-name').classList.add('hidden');
      document.getElementById('view-quiz').classList.remove('hidden');
      renderRound();
    }

    function renderRound() {
      const q = questions[currentRound];
      document.getElementById('round-counter').innerText = `RONDE ${currentRound + 1} / 8`;
      document.getElementById('round-bar').style.width = `${((currentRound + 1) / questions.length) * 100}%`;
      document.getElementById('opt-left-text').innerText = q.left.text;
      document.getElementById('opt-right-text').innerText = q.right.text;
    }

    function chooseOption(choice) {
      const selected = choice === 'left' ? questions[currentRound].left : questions[currentRound].right;
      for (const [trait, pt] of Object.entries(selected.traits)) {
        scores[trait] += pt;
      }

      currentRound++;
      if (currentRound < questions.length) {
        renderRound();
      } else {
        finishQuiz();
      }
    }

    async function finishQuiz() {
      let topTrait = 'analitis';
      let maxScore = -1;
      for (const [trait, sc] of Object.entries(scores)) {
        if (sc > maxScore) { maxScore = sc; topTrait = trait; }
      }

      const result = archetypes[topTrait];

      document.getElementById('view-quiz').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');
      document.getElementById('res-archetype').innerText = result.name;
      document.getElementById('res-subtitle').innerText = result.subtitle;
      document.getElementById('res-majors').innerText = result.majors;

      // Kirim hasil ke Google Sheets via POST
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: playerName,
            archetype: result.name
          })
        });
        document.getElementById('save-status').innerHTML = `<span class="text-emerald-400 font-bold">✓ Data kamu sudah masuk ke layar proyektor!</span>`;
      } catch (err) {
        document.getElementById('save-status').innerText = "Tersimpan.";
      }
    }
  </script>
</body>
</html>
